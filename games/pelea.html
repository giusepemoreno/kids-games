<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Pelea de Papel</title>
  <meta name="theme-color" content="#23305a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pelea" />
  <link rel="apple-touch-icon" href="../icons/pelea-180.png" />
  <style>
    @font-face { font-family: 'Bowlby One'; src: url(pelea/fonts/bowlby-one.woff2) format('woff2'); font-display: block; }
    @font-face { font-family: 'Patrick Hand'; src: url(pelea/fonts/patrick-hand.woff2) format('woff2'); font-display: block; }
    @font-face { font-family: 'Rubik'; src: url(pelea/fonts/rubik.woff2) format('woff2'); font-weight: 300 900; font-display: swap; }

    :root {
      --ink: #1e1a16; --paper: #fbf7ee; --cream: #f6efe1;
      --red: #d6452f; --red-d: #b5371f; --yellow: #f0b429;
      --teal: #1f8a8a; --teal-d: #1f6f6f; --navy: #23305a;
      --purple: #6b4fa0; --purple-d: #4f3a7c; --kraft: #c49a5c; --brown: #5c4a33;
      --drop: 0 6px 0 rgba(30, 26, 22, 0.35);
      --display: 'Bowlby One', Impact, sans-serif;
      --hand: 'Patrick Hand', 'Comic Sans MS', cursive;
      --ui: Rubik, ui-rounded, system-ui, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--navy); color: var(--ink); font-family: var(--ui);
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      touch-action: none; overscroll-behavior: none;
    }
    button { font: inherit; color: inherit; cursor: pointer; padding: 0; margin: 0; border: 0; background: none; }
    button:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }
    button:disabled { cursor: default; }

    /* The game is laid out on an 820px-tall stage, scaled to fit the screen. */
    #stage { position: absolute; left: 0; top: 0; width: 1180px; height: 820px; transform-origin: 0 0; overflow: hidden; }
    .screen { position: absolute; inset: 0; overflow: hidden; }
    .layer { position: absolute; left: 0; right: 0; }
    .paper-edge { background: var(--paper); }

    /* ---------- shared paper bits ---------- */
    .pbtn {
      display: flex; align-items: center; justify-content: center;
      border: 5px solid var(--paper); box-shadow: var(--drop);
      font-family: var(--display); line-height: 1;
      transform: rotate(var(--r, 0deg));
      transition: transform 80ms, box-shadow 80ms;
    }
    .pbtn:active:not(:disabled) { transform: translateY(5px) rotate(var(--r, 0deg)); box-shadow: 0 1px 0 rgba(30, 26, 22, 0.35); }
    .tag { display: inline-block; padding: 3px 10px; border: 3px solid var(--paper); color: var(--paper); font-weight: 800; font-size: 16px; line-height: 1.2; }
    .tag.red { background: var(--red); }
    .tag.teal { background: var(--teal-d); }
    .chip { padding: 8px 14px; border: 3px solid var(--paper); font-weight: 800; font-size: 17px; }
    .round-btn {
      width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper);
      display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 rgba(30, 26, 22, 0.3);
    }
    .round-btn svg { width: 24px; height: 24px; fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- loading / rotate ---------- */
    #loading, #rotate {
      position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; gap: 18px;
      align-items: center; justify-content: center; background: var(--navy); color: var(--paper);
      font-family: var(--display); font-size: 34px; text-align: center; padding: 24px;
    }
    #rotate { display: none; }
    #rotate .phone { width: 70px; height: 110px; border: 6px solid var(--paper); border-radius: 14px; animation: turn 1.6s ease-in-out infinite; }
    @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) { #rotate { display: flex; } }

    /* ---------- 1 · title ---------- */
    #scrTitle { background: var(--navy); }
    .moon { position: absolute; right: 170px; top: 70px; width: 150px; height: 150px; border-radius: 50%; background: #f6efe1; border: 6px solid var(--paper); box-shadow: 0 8px 0 rgba(10, 14, 30, 0.35); }
    .star { position: absolute; background: var(--yellow); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
    .star.w { background: #f6efe1; }
    .hills { bottom: 208px; height: 260px; background: #34477c; clip-path: polygon(0% 100%, 0% 55%, 8% 35%, 18% 48%, 30% 18%, 42% 40%, 55% 22%, 68% 45%, 80% 15%, 92% 38%, 100% 28%, 100% 100%); }
    .hills.paper-edge { bottom: 214px; background: var(--paper); }
    .ground { bottom: 0; height: 228px; background: var(--kraft); clip-path: polygon(0% 14%, 4% 6%, 9% 12%, 14% 3%, 20% 10%, 26% 4%, 31% 11%, 37% 2%, 43% 9%, 49% 5%, 55% 12%, 61% 3%, 67% 10%, 73% 4%, 79% 11%, 85% 2%, 91% 9%, 96% 4%, 100% 10%, 100% 100%, 0% 100%); }
    .ground.paper-edge { height: 236px; background: var(--paper); }
    .title-word {
      position: absolute; left: 0; right: 0; top: 96px; display: flex; flex-direction: column; align-items: center; gap: 6px;
      filter: drop-shadow(0 8px 0 rgba(10, 14, 30, 0.4)); pointer-events: none;
    }
    .title-word div { display: flex; gap: 8px; align-items: center; }
    .cut { display: block; padding: 6px 16px 2px; border: 5px solid var(--paper); font-family: var(--display); font-size: 84px; line-height: 1; color: var(--paper); transform: rotate(var(--r, 0deg)); }
    .cut.small { padding: 4px 14px 0; border: 0; background: var(--paper); color: var(--navy); font-size: 40px; line-height: 1.1; }
    .menu { position: absolute; left: 0; right: 0; top: 392px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .menu .big { width: 300px; height: 72px; font-size: 30px; position: relative; }
    .menu .opt { width: 220px; height: 52px; border-width: 4px; font-family: var(--ui); font-weight: 700; font-size: 20px; background: var(--navy); color: var(--paper); }
    .menu .big:disabled { opacity: 0.6; }
    .sticker { position: absolute; right: -26px; top: -18px; padding: 4px 10px; background: var(--yellow); color: var(--ink); border: 3px solid var(--paper); font-family: var(--ui); font-weight: 800; font-size: 16px; transform: rotate(8deg); box-shadow: 0 3px 0 rgba(30, 26, 22, 0.3); }
    .title-fighter { position: absolute; top: 280px; width: 320px; height: 440px; pointer-events: none; }
    .home-btn { position: absolute; left: 24px; top: 22px; display: flex; color: var(--ink); text-decoration: none; align-items: center; gap: 8px; padding: 8px 16px 8px 10px; background: var(--paper); border: 3px solid var(--ink); font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 rgba(10, 14, 30, 0.35); }
    .home-btn svg { width: 22px; height: 22px; fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- 2 · select ---------- */
    #scrSelect { background: var(--kraft); }
    .band { top: 0; height: 110px; background: var(--navy); clip-path: polygon(0% 0%, 100% 0%, 100% 86%, 95% 94%, 89% 84%, 83% 96%, 76% 86%, 70% 95%, 63% 85%, 57% 97%, 50% 87%, 44% 95%, 37% 84%, 31% 96%, 24% 86%, 18% 94%, 11% 85%, 5% 96%, 0% 88%); }
    .band.paper-edge { height: 118px; background: var(--paper); }
    .sel-head { position: absolute; left: 40px; top: 22px; display: flex; align-items: center; gap: 18px; }
    .sel-head h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 46px; line-height: 1; color: var(--paper); }
    .sel-head .badge { padding: 6px 12px; background: var(--yellow); border: 3px solid var(--paper); font-weight: 800; font-size: 18px; transform: rotate(3deg); }
    .sel-step { position: absolute; right: 40px; top: 30px; font-family: var(--hand); font-size: 30px; color: var(--paper); }
    .roster { position: absolute; left: 40px; top: 150px; width: 400px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px 24px; }
    .card {
      position: relative; height: 170px; background: var(--cream); border: 5px solid var(--paper);
      box-shadow: var(--drop); transform: rotate(var(--r, 0deg));
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      outline: 5px solid transparent; outline-offset: 4px;
    }
    .card img { max-width: 120px; max-height: 108px; object-fit: contain; pointer-events: none; }
    .card .nm { font-family: var(--hand); font-size: 22px; line-height: 1; }
    .card.p1 { outline-color: var(--red); }
    .card.p2 { outline-color: var(--teal); }
    .card.p1.p2 { outline-color: var(--red); box-shadow: 0 0 0 14px var(--teal), var(--drop); }
    .card .tag { position: absolute; top: -16px; display: none; }
    .card .tag.red { left: -12px; }
    .card .tag.teal { right: -12px; }
    .card.p1 .tag.red, .card.p2 .tag.teal { display: block; }
    .card .dice { font-family: var(--display); font-size: 70px; line-height: 1; color: var(--navy); }
    .sheet {
      position: absolute; left: 480px; right: 36px; top: 138px; height: 560px; padding: 26px 26px 26px 26px;
      background: var(--cream); border: 6px solid var(--paper); box-shadow: 0 8px 0 rgba(30, 26, 22, 0.3);
      transform: rotate(1deg); display: flex; gap: 22px;
    }
    .portrait { position: relative; flex: 0 0 220px; height: 496px; background: var(--navy); border: 4px solid var(--ink); overflow: hidden; }
    .portrait .floor { position: absolute; left: 0; bottom: 0; width: 100%; height: 90px; background: var(--kraft); clip-path: polygon(0% 18%, 12% 6%, 26% 16%, 40% 4%, 55% 14%, 70% 3%, 85% 15%, 100% 6%, 100% 100%, 0% 100%); }
    .portrait canvas { position: absolute; left: 0; top: 0; width: 220px; height: 496px; }
    .portrait .tag { position: absolute; left: 10px; top: 10px; }
    .portrait .mystery { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 150px; color: var(--paper); }
    .info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    .info h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1.05; color: var(--red-d); }
    .lbl { display: block; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brown); }
    .hand { font-family: var(--hand); font-size: 23px; line-height: 1.2; margin: 0; }
    .moves { display: flex; flex-direction: column; gap: 7px; }
    .move-row { display: flex; align-items: center; gap: 10px; padding: 5px 10px; background: var(--paper); border: 2px solid var(--ink); }
    .move-row .txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
    .move-row .mn { font-family: var(--hand); font-size: 22px; line-height: 1.1; }
    .move-row .me { font-size: 13.5px; font-weight: 600; color: var(--brown); line-height: 1.2; }
    .move-row .dot { flex: 0 0 34px; height: 34px; border-radius: 50%; border: 3px solid var(--paper); outline: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 14px; color: var(--paper); }
    .stats { display: flex; gap: 22px; margin-top: auto; }
    .stats .boxes { display: flex; gap: 3px; margin-top: 4px; }
    .stats .boxes i { width: 18px; height: 20px; border: 2.5px solid var(--ink); background: var(--paper); }
    .stats .boxes i.on { background: var(--red); }
    .sel-foot { position: absolute; left: 40px; right: 40px; bottom: 30px; height: 70px; display: flex; align-items: center; gap: 16px; }
    .sel-foot .back { height: 56px; padding: 0 22px; background: var(--navy); color: var(--paper); font-family: var(--ui); font-weight: 700; font-size: 21px; border-width: 4px; }
    .sel-foot .chips { flex: 1; display: flex; justify-content: center; gap: 14px; }
    .sel-foot .chip.wait { background: transparent; border: 3px dashed var(--teal-d); color: var(--teal-d); }
    .sel-foot .chip.red { background: var(--red); color: var(--paper); }
    .sel-foot .chip.teal { background: var(--teal-d); color: var(--paper); }
    .sel-foot .go { height: 72px; padding: 0 34px; font-size: 34px; background: var(--yellow); --r: -1.5deg; }
    .sel-foot .go:disabled { opacity: 0.5; }

    /* ---------- 3 · fight ---------- */
    #scrFight { background: var(--kraft); }
    #cv { position: absolute; left: 0; top: 0; }
    .hud { position: absolute; left: 30px; right: 30px; top: 22px; display: grid; grid-template-columns: 1fr 110px 1fr; gap: 14px; pointer-events: none; }
    .side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .side .row { display: flex; align-items: center; gap: 10px; }
    .side .nm { font-family: var(--hand); font-size: 26px; line-height: 1; color: var(--ink); white-space: nowrap; }
    .side .sp { flex: 1; }
    .dots { display: flex; gap: 8px; }
    .dots i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--ink); }
    .dots i.on { background: var(--yellow); }
    .bar { position: relative; height: 32px; background: var(--paper); border: 4px solid var(--ink); box-shadow: 0 5px 0 rgba(30, 26, 22, 0.3); overflow: hidden; transform: rotate(-0.6deg); }
    .bar .fill, .bar .ghost { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; }
    .bar .ghost { background: #f3d39a; transition: width 0.6s ease-out 0.25s; }
    .bar .fill { background: var(--red); transition: width 0.12s; clip-path: polygon(0% 0%, 100% 0%, 97% 30%, 100% 55%, 96% 80%, 99% 100%, 0% 100%); }
    .meter { display: flex; gap: 6px; }
    .meter i { width: 46px; height: 14px; border: 3px solid var(--ink); background: linear-gradient(90deg, var(--yellow) calc(var(--f, 0) * 100%), var(--paper) 0); }
    .meter.full i { background: var(--yellow); animation: glow 0.6s ease-in-out infinite alternate; }
    @keyframes glow { to { background: #ffe27a; box-shadow: 0 0 10px #ffe27a; } }
    .side.p2 .row, .side.p2 .meter { flex-direction: row-reverse; }
    .side.p2 .bar { transform: rotate(0.6deg); }
    .side.p2 .bar .fill, .side.p2 .bar .ghost { left: auto; right: 0; }
    .side.p2 .bar .fill { background: var(--teal); clip-path: polygon(3% 0%, 100% 0%, 100% 100%, 1% 100%, 4% 70%, 0% 45%, 3% 20%); }
    .mid { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .timer { width: 90px; height: 90px; border-radius: 50%; background: var(--paper); border: 5px solid var(--ink); box-shadow: 0 6px 0 rgba(30, 26, 22, 0.3); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 40px; padding-top: 4px; }
    .timer.low { color: var(--red); }
    .rnd { padding: 3px 10px; background: var(--navy); color: var(--paper); border: 3px solid var(--paper); font-weight: 800; font-size: 15px; white-space: nowrap; transform: rotate(-2deg); }
    .mid .round-btn { pointer-events: auto; width: 48px; height: 48px; }
    .combo { position: absolute; top: 172px; padding: 6px 14px; background: var(--paper); border: 4px solid var(--ink); box-shadow: 0 5px 0 rgba(30, 26, 22, 0.3); font-family: var(--display); font-size: 28px; line-height: 1.1; color: var(--red-d); pointer-events: none; }
    #combo1 { left: 60px; transform: rotate(-5deg); }
    #combo2 { right: 60px; transform: rotate(5deg); color: var(--teal-d); }
    .combo.pop { animation: pop 0.25s ease-out; }
    @keyframes pop { 0% { scale: 0.4; } 70% { scale: 1.2; } 100% { scale: 1; } }

    /* touch controls */
    .pad { position: absolute; left: 22px; bottom: 18px; width: 330px; height: 190px; touch-action: none; }
    .pad .k, .acts .k {
      position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-align: center;
      box-shadow: 0 6px 0 rgba(30, 26, 22, 0.35); pointer-events: none; transition: transform 60ms;
    }
    .pad .k { width: 88px; height: 88px; border: 5px solid var(--ink); background: var(--paper); }
    .pad .k svg { width: 38px; height: 38px; fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .pad .k.left { left: 10px; bottom: 12px; }
    .pad .k.up { left: 121px; bottom: 76px; }
    .pad .k.right { left: 232px; bottom: 12px; }
    .k.on { transform: translateY(5px); box-shadow: 0 1px 0 rgba(30, 26, 22, 0.35); }
    .acts { position: absolute; right: 18px; bottom: 16px; width: 420px; height: 290px; }
    .acts .k { pointer-events: auto; touch-action: none; border: 5px solid var(--paper); color: var(--paper); font-family: var(--display); font-size: 18px; line-height: 1.05; }
    .acts .k.punch { width: 104px; height: 104px; right: 156px; bottom: 6px; background: var(--red); }
    .acts .k.kick { width: 100px; height: 100px; right: 128px; bottom: 132px; background: var(--navy); }
    .acts .k.m1 { width: 94px; height: 94px; right: 278px; bottom: 22px; background: var(--teal); }
    .acts .k.m2 { width: 94px; height: 94px; right: 24px; bottom: 172px; background: var(--purple); }
    .acts .k.sup { width: 124px; height: 124px; right: 6px; bottom: 16px; background: var(--yellow); color: var(--ink); border-width: 6px; outline: 5px solid var(--ink); font-size: 18px; }
    .acts .k.m1, .acts .k.m2 { font-family: var(--hand); font-size: 22px; line-height: 0.95; padding: 8px 5px; overflow: hidden; overflow-wrap: normal; }
    .acts .k.cool::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(30, 26, 22, 0.6) calc(var(--cd, 0) * 360deg), transparent 0); }
    .acts .k.sup:not(.ready) { filter: grayscale(0.85); opacity: 0.6; }
    .acts .k.sup.ready { animation: ready 0.7s ease-in-out infinite alternate; }
    @keyframes ready { to { box-shadow: 0 6px 0 rgba(30, 26, 22, 0.35), 0 0 0 10px rgba(255, 226, 122, 0.7); } }

    #announce { position: absolute; left: 0; right: 0; top: 270px; display: flex; justify-content: center; pointer-events: none; }
    #announce span { display: block; padding: 12px 30px 4px; border: 7px solid var(--paper); font-family: var(--display); font-size: 96px; line-height: 1; color: var(--paper); box-shadow: 0 10px 0 rgba(30, 26, 22, 0.35); animation: slam 1.1s ease-out both; }
    @keyframes slam { 0% { transform: scale(2.4) rotate(-8deg); opacity: 0; } 14% { transform: scale(0.94) rotate(-3deg); opacity: 1; } 22% { transform: scale(1.04) rotate(-3deg); } 80% { transform: scale(1) rotate(-3deg); opacity: 1; } 100% { transform: scale(1) rotate(-3deg); opacity: 0; } }
    #banner { position: absolute; left: 0; right: 0; top: 300px; height: 130px; display: flex; align-items: center; justify-content: center; gap: 22px; background: var(--ink); border-top: 7px solid var(--yellow); border-bottom: 7px solid var(--yellow); pointer-events: none; animation: sweep 1s ease-out both; }
    #banner img { height: 110px; transform: rotate(-6deg); }
    #banner b { font-family: var(--display); font-weight: 400; font-size: 64px; color: var(--yellow); white-space: nowrap; }
    @keyframes sweep { 0% { transform: translateX(-100%) skewX(-10deg); } 18% { transform: translateX(0) skewX(-10deg); } 82% { transform: translateX(0) skewX(-10deg); opacity: 1; } 100% { transform: translateX(100%) skewX(-10deg); opacity: 0; } }

    /* ---------- 4 · K.O. ---------- */
    #scrKO { background: var(--purple-d); }
    .rays { position: absolute; left: 50%; top: 45%; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px; background: repeating-conic-gradient(from 0deg, #6b4fa0 0 12deg, transparent 12deg 30deg); animation: spin 40s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ko-word { position: absolute; left: 0; right: 0; top: 30px; display: flex; justify-content: center; gap: 10px; filter: drop-shadow(0 8px 0 rgba(10, 14, 30, 0.4)); }
    .ko-word .cut { font-size: 110px; padding: 10px 26px 2px; }
    .winner-tag { position: absolute; left: 0; right: 0; top: 210px; display: flex; justify-content: center; }
    .winner-tag span { padding: 12px 34px 6px; background: var(--paper); border: 5px solid var(--ink); box-shadow: 0 7px 0 rgba(10, 14, 30, 0.4); font-family: var(--display); font-size: 40px; color: var(--red-d); transform: rotate(-1deg); }
    #koFighter { position: absolute; left: calc(50% - 180px); top: 280px; width: 360px; height: 400px; pointer-events: none; }
    .bubble { position: absolute; left: calc(50% + 170px); top: 330px; max-width: 330px; padding: 16px 22px; background: var(--paper); border-radius: 22px; box-shadow: 0 6px 0 rgba(10, 14, 30, 0.35); font-family: var(--hand); font-size: 32px; line-height: 1.15; transform: rotate(1.5deg); }
    .bubble::before { content: ''; position: absolute; left: -26px; bottom: 26px; border: 16px solid transparent; border-right: 22px solid var(--paper); border-left: 0; }
    .ko-stats { position: absolute; left: 110px; top: 360px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
    .ko-stats span { padding: 8px 16px; background: var(--paper); border: 4px solid var(--ink); font-weight: 800; font-size: 19px; box-shadow: 0 5px 0 rgba(10, 14, 30, 0.35); }
    .ko-stats span:nth-child(odd) { transform: rotate(-1.5deg); }
    .ko-stats span.gold { background: var(--yellow); }
    .ko-ground { bottom: 0; height: 160px; background: var(--kraft); clip-path: polygon(0% 10%, 6% 4%, 12% 9%, 19% 3%, 26% 9%, 33% 4%, 40% 10%, 47% 3%, 54% 9%, 61% 4%, 68% 10%, 75% 3%, 82% 9%, 89% 4%, 95% 9%, 100% 4%, 100% 100%, 0% 100%); }
    .ko-ground.paper-edge { height: 168px; background: var(--paper); }
    .ko-actions { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; align-items: center; gap: 22px; }
