:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
/* Layout: one-screen game column — header, control strip, board that sizes itself to the space left, keyboard pinned at the bottom */
:root {
  --bg: #edf1ec;
  --surface: #f8faf6;
  --ink: #1b2420;
  --muted: #63706a;
  --line: #c9d3cc;
  --key: #d9e1db;
  --hit: #1f7a5c;
  --near: #cf9a16;
  --miss: #7a8681;
  --on-tile: #ffffff;
  --on-near: #2a1d00;
  --key-ink: #1b2420;
  --key-used: #7a8681;
  --key-used-ink: #ffffff;
  --scrim: rgba(18, 26, 23, .45);
  --font-display: "Arial Rounded MT Bold", "Arial Black", system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #1a221f; --ink: #e5ece8; --muted: #93a19a; --line: #2f3a36;
    --key: #46524d; --hit: #1f7d5e; --near: #d9a92e; --miss: #3b4541; --on-tile: #ffffff;
    --on-near: #241900; --key-ink: #f1f5f3; --key-used: #161c1a; --key-used-ink: #6f7c76;
    --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #1a221f; --ink: #e5ece8; --muted: #93a19a; --line: #2f3a36;
  --key: #46524d; --hit: #1f7d5e; --near: #d9a92e; --miss: #3b4541; --on-tile: #ffffff;
  --on-near: #241900; --key-ink: #f1f5f3; --key-used: #161c1a; --key-used-ink: #6f7c76;
  --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--hit); outline-offset: 2px; }

.app {
  height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; }
.back { margin-left: -8px; flex-shrink: 0; }
header .brand { flex: 1; }
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand h1 {
  margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; letter-spacing: -.02em; line-height: 1;
}
.brand h1 span { color: var(--hit); }
.brand .day { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.icons { display: flex; gap: 4px; }
.icon-btn {
  width: 40px; height: 40px; border: 0; background: transparent; border-radius: 10px; display: grid; place-items: center;
}
.icon-btn:hover { background: var(--key); }
.icon-btn svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.controls { display: grid; grid-template-columns: auto auto auto; gap: 6px; justify-content: space-between; flex-shrink: 0; }
.seg { display: flex; background: var(--key); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: transparent; border-radius: 7px; padding: 6px 10px; font-size: .82rem; font-weight: 700;
  letter-spacing: .02em; color: var(--muted); min-height: 32px;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.seg .tag { font-weight: 400; opacity: .75; margin-left: 3px; font-size: .72rem; }
#modeSeg button { min-width: 4.6em; }

.board-wrap { flex: 1 1 0; min-height: 0; display: grid; place-items: center; position: relative; overflow: hidden; }
.board { display: grid; gap: 6px; }
.row { display: grid; gap: 6px; }
.row.shake { animation: shake .45s; }
.tile {
  width: var(--tile, 56px); height: var(--tile, 56px); border: 2px solid var(--line); border-radius: 8px;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 800;
  font-size: calc(var(--tile, 56px) * .5); text-transform: uppercase; line-height: 1; user-select: none;
  background: var(--surface);
}
.tile.filled { border-color: var(--muted); animation: pop .12s; }
.tile.hit, .tile.near, .tile.miss { color: var(--on-tile); border-color: transparent; }
.tile.hit { background: var(--hit); }
.tile.near { background: var(--near); color: var(--on-near); }
.tile.miss { background: var(--miss); }
.tile.flip { animation: flip .5s ease both; }
.tile.win { animation: bounce .6s ease; }

.keyboard { display: flex; flex-direction: column; gap: 6px; padding-bottom: clamp(18px, 3.5vh, 32px); flex-shrink: 0; }
.krow { display: flex; gap: 5px; justify-content: center; }
.key {
  flex: 1 1 0; min-width: 0; height: clamp(46px, 7.2vh, 58px); border: 0; border-radius: 7px; background: var(--key); color: var(--key-ink);
  font-weight: 700; font-size: 1rem; text-transform: uppercase; display: grid; place-items: center; padding: 0;
  touch-action: manipulation; transition: background-color .2s;
}
.key.wide { flex: 1.55 1 0; font-size: .72rem; letter-spacing: .03em; }
.key svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.key.hit { background: var(--hit); color: var(--on-tile); }
.key.near { background: var(--near); color: var(--on-near); }
.key.miss { background: var(--key-used); color: var(--key-used-ink); }
.key:active { filter: brightness(.9); }
.spacer { flex: .5 1 0; }

.toast-area { position: absolute; top: 4px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 5; }
.toast { background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 8px; font-weight: 700; font-size: .9rem; animation: fadein .15s; }

.end-bar { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
.btn {
  border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700; background: var(--hit); color: var(--on-tile); min-height: 42px;
}
.btn.ghost { background: var(--key); color: var(--ink); }
.reveal { font-size: .9rem; color: var(--muted); }
.reveal b { font-family: var(--font-display); color: var(--ink); font-size: 1.1rem; letter-spacing: .06em; text-transform: uppercase; }

.overlay {
  position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
}
.modal {
  background: var(--surface); border-radius: 14px; width: 100%; max-width: 420px; max-height: 100%; overflow: auto;
  padding: 20px; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.25); animation: rise .2s ease;
}
.modal h2 { margin: 0 0 12px; font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; text-wrap: balance; }
.modal h3 { margin: 18px 0 8px; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.modal p { margin: 0 0 10px; line-height: 1.5; }
.modal .close { position: absolute; top: 10px; right: 10px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.stats .num { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.stats .lbl { font-size: .72rem; color: var(--muted); line-height: 1.25; }
.dist { display: grid; gap: 4px; }
.dist .bar-row { display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: center; font-size: .85rem; font-variant-numeric: tabular-nums; }
.dist .bar { background: var(--miss); color: var(--on-tile); text-align: right; padding: 2px 7px; border-radius: 4px; min-width: 24px; font-weight: 700; font-size: .8rem; }
.dist .bar.cur { background: var(--hit); }
.example { display: flex; gap: 4px; margin: 6px 0 4px; }
.example .tile { --tile: 36px; }
.modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.modal-actions .btn { flex: 1; }
.export-row { display: flex; justify-content: flex-end; margin-top: 14px; }
.export-row .btn { min-height: 36px; padding: 7px 12px; font-size: .85rem; }
.share-fallback { width: 100%; min-height: 120px; margin-top: 10px; font-family: ui-monospace, monospace; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 8px; }
.scope { font-size: .8rem; color: var(--muted); margin-top: -6px; }

@keyframes pop { 50% { transform: scale(1.08); } }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes bounce { 40% { transform: translateY(-14px); } 70% { transform: translateY(3px); } }
@keyframes fadein { from { opacity: 0; transform: translateY(-4px); } }
@keyframes rise { from { transform: translateY(12px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition: none !important; }
}
@media (max-width: 460px) {
  .seg .tag { display: none; }
  .seg button { padding: 6px 9px; }
}
@media (max-width: 360px) {
  .seg button { padding: 6px 6px; font-size: .78rem; }
  #modeSeg button { min-width: 4.2em; }
  .brand h1 { font-size: 1.5rem; }
}

    if (cache[id]) return cache[id];
    const r = RAW[lang][L];
    const answers = r.a.split(' ');
    const daily = answers.slice();
    const rnd = seeded(hashStr('trivoca-' + id));
    for (let i = daily.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [daily[i], daily[j]] = [daily[j], daily[i]]; }
    return (cache[id] = { answers, daily, valid: new Set(r.v.split(' ')), display: r.d });
  }
  function shown(lang, L, key) { return (words(lang, L).display[key] || key); }

  function dayNumber() {
    const now = new Date();
    const mid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((mid - EPOCH) / 86400000) + 1;
  }

  function normKey(ch, lang) {
    ch = ch.toLowerCase();
    if (lang === 'es' && ch === 'ñ') return 'ñ';
    const b = ch.normalize('NFD')[0];
    return /^[a-z]$/.test(b) ? b : null;
  }

  // ---------- state ----------
  const prefs = store.get('prefs', null) || {
    lang: (navigator.language || 'en').slice(0, 2) === 'pt' ? 'pt' : (navigator.language || '').slice(0, 2) === 'es' ? 'es' : 'en',
    len: 5, mode: 'daily'
  };
  let game = null; // {answer, guesses:[], status:'play'|'won'|'lost', key}
  let current = '';
  let busy = false;

  function gameKey() {
    return prefs.mode === 'daily' ? `daily:${prefs.lang}:${prefs.len}:${dayNumber()}` : `free:${prefs.lang}:${prefs.len}`;
  }
  function loadGame() {
    const key = gameKey();
    let g = store.get(key, null);
    const W = words(prefs.lang, prefs.len);
    if (prefs.mode === 'daily') {
      const ans = W.daily[(dayNumber() - 1 + W.daily.length * 1000) % W.daily.length];
      if (!g || g.answer !== ans) g = { answer: ans, guesses: [], status: 'play' };
    } else if (!g || !W.valid.has(g.answer)) {
      g = newFree();
    }
    g.key = key;
    game = g; current = '';
  }
  function newFree() {
    const W = words(prefs.lang, prefs.len);
    let a; do { a = W.answers[Math.floor(Math.random() * W.answers.length)]; } while (game && a === game.answer);
    return { answer: a, guesses: [], status: 'play' };
  }
  function saveGame() { const { key, ...rest } = game; store.set(game.key, rest); }

  function score(guess, ans) {
    const res = Array(guess.length).fill('miss'), left = {};
    const g = [...guess], a = [...ans];
    a.forEach((c, i) => { if (g[i] === c) res[i] = 'hit'; else left[c] = (left[c] || 0) + 1; });
    g.forEach((c, i) => { if (res[i] !== 'hit' && left[c] > 0) { res[i] = 'near'; left[c]--; } });
    return res;
  }

  // ---------- stats ----------
  function statsKey() { return `stats:${prefs.mode}:${prefs.lang}:${prefs.len}`; }
  function getStats() { return store.get(statsKey(), { played: 0, wins: 0, streak: 0, best: 0, dist: [0, 0, 0, 0, 0, 0] }); }
  function record(won, n) {
    const s = getStats();
    s.played++; if (won) { s.wins++; s.streak++; s.best = Math.max(s.best, s.streak); s.dist[n - 1]++; } else s.streak = 0;
    store.set(statsKey(), s);
    const log = store.get('log', []);
    const now = new Date();
    log.push({
      id: prefs.mode === 'daily' ? game.key : `${game.key}:${now.getTime()}`,
      t: now.getTime(), date: isoDate(now), mode: prefs.mode, lang: prefs.lang, len: prefs.len,
      day: prefs.mode === 'daily' ? dayNumber() : null, answer: game.answer,
      result: won ? 'won' : 'lost', tries: won ? n : null, guesses: game.guesses.slice()
    });
    store.set('log', log.slice(-4000));
  }
  function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

  // ---------- rendering ----------
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), kbEl = $('keyboard');

  function t() { return T[prefs.lang]; }

  function renderControls() {
    document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === prefs.lang));
    document.querySelectorAll('#lenSeg button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.len === prefs.len));
    document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === prefs.mode));
    $('modeDaily').textContent = t().daily; $('modeFree').textContent = t().free;
    $('dayLabel').textContent = prefs.mode === 'daily' ? t().day(dayNumber()) : t().practice;
    document.documentElement.lang = prefs.lang === 'pt' ? 'pt-BR' : prefs.lang === 'es' ? 'es-419' : 'en-US';
  }

  function renderBoard(animateRow = -1) {
    const L = prefs.len;
    boardEl.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
      const row = document.createElement('div');
      row.className = 'row'; row.style.gridTemplateColumns = `repeat(${L}, var(--tile))`;
      const g = game.guesses[r];
      const res = g ? score(g, game.answer) : null;
      const disp = g ? [...shown(prefs.lang, L, g)] : null;
      for (let c = 0; c < L; c++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        if (g) {
          tile.textContent = disp[c];
          if (r === animateRow) {
            tile.textContent = g[c] === 'ñ' ? 'ñ' : g[c];
            tile.classList.add('filled');
            tile.style.animationDelay = (c * 250) + 'ms';
            setTimeout(() => { tile.classList.remove('filled'); tile.classList.add('flip'); }, 0);
            setTimeout(() => { tile.className = 'tile flip ' + res[c]; tile.textContent = disp[c]; }, c * 250 + 250);
          } else tile.classList.add(res[c]);
        } else if (r === game.guesses.length && game.status === 'play' && current[c]) {
          tile.textContent = current[c]; tile.classList.add('filled');
        }
        row.appendChild(tile);
      }
      boardEl.appendChild(row);
    }
    sizeTiles();
  }

  function updateCurrentRow() {
    const row = boardEl.children[game.guesses.length];
    if (!row) return;
    [...row.children].forEach((tile, c) => {
      const ch = current[c] || '';
      if (tile.textContent !== ch) {
        tile.textContent = ch;
        tile.classList.toggle('filled', !!ch);
      }
    });
  }

  function keyStates() {
    const st = {}, rank = { miss: 1, near: 2, hit: 3 };
    game.guesses.forEach(g => {
      const res = score(g, game.answer);
      [...g].forEach((c, i) => { if (!st[c] || rank[res[i]] > rank[st[c]]) st[c] = res[i]; });
    });
    return st;
  }

  const ICON_BACK = '<svg viewBox="0 0 24 24"><path d="M9 6h11v12H9l-6-6z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>';
  function renderKeyboard() {
    const st = keyStates();
    kbEl.innerHTML = '';
    KEYS[prefs.lang].forEach((rowStr, ri) => {
      const row = document.createElement('div'); row.className = 'krow';
      if (ri === 1 && rowStr.length === 9) row.appendChild(Object.assign(document.createElement('div'), { className: 'spacer' }));
      for (const ch of rowStr) {
        const b = document.createElement('button');
        b.className = 'key';
        if (ch === '>') { b.classList.add('wide'); b.textContent = t().enter; b.dataset.k = 'Enter'; b.setAttribute('aria-label', 'Enter'); }
        else if (ch === '<') { b.classList.add('wide'); b.innerHTML = ICON_BACK; b.dataset.k = 'Backspace'; b.setAttribute('aria-label', 'Backspace'); }
        else { b.textContent = ch; b.dataset.k = ch; if (st[ch]) b.classList.add(st[ch]); }
        row.appendChild(b);
      }
      if (ri === 1 && rowStr.length === 9) row.appendChild(Object.assign(document.createElement('div'), { className: 'spacer' }));
      kbEl.appendChild(row);
    });
  }

  function renderEnd() {
    const bar = $('endBar');
    if (game.status === 'play') { bar.hidden = true; bar.innerHTML = ''; return; }
    bar.hidden = false;
    const word = shown(prefs.lang, prefs.len, game.answer);
    bar.innerHTML = '';
    if (game.status === 'lost') {
      const r = document.createElement('span'); r.className = 'reveal';
      r.innerHTML = `${t().was} <b></b>`; r.querySelector('b').textContent = word; bar.appendChild(r);
    }
    const sb = document.createElement('button'); sb.className = 'btn ghost'; sb.textContent = t().stats; sb.onclick = openStats; bar.appendChild(sb);
    if (prefs.mode === 'free') {
      const nb = document.createElement('button'); nb.className = 'btn'; nb.textContent = t().next; nb.onclick = startFree; bar.appendChild(nb);
    } else {
      const sh = document.createElement('button'); sh.className = 'btn'; sh.textContent = t().share; sh.onclick = share; bar.appendChild(sh);
    }
    sizeTiles();
  }

  function renderAll() { renderControls(); renderBoard(); renderKeyboard(); renderEnd(); }

  function sizeTiles() {
    const wrap = $('boardWrap');
    const L = prefs.len, gap = 6;
    // Measure the space actually left on screen, not the wrap's own box,
    // so the board can never grow into the keyboard (iPad landscape, Safari toolbars).
    const app = $('app'), root = getComputedStyle(document.documentElement), ac = getComputedStyle(app);
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    let used = parseFloat(root.paddingTop) + parseFloat(root.paddingBottom) + parseFloat(ac.paddingTop) + parseFloat(ac.paddingBottom);
    const parts = [...app.children].filter(el => el !== wrap && !el.hidden);
    parts.forEach(el => { used += el.offsetHeight; });
    used += parseFloat(ac.rowGap || ac.gap || 10) * parts.length;
    const h = Math.min(wrap.clientHeight || Infinity, vh - used - 4);
    const w = wrap.clientWidth;
    const size = Math.max(22, Math.floor(Math.min((w - gap * (L - 1)) / L, (h - gap * (ROWS - 1)) / ROWS, 62)));
    boardEl.style.setProperty('--tile', size + 'px');
  }

  function toast(msg, ms = 1400) {
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(() => el.remove(), ms);
  }

  // ---------- input ----------
  function press(k) {
    if (busy || !game || game.status !== 'play' || !$('overlay').hidden) return;
    const L = prefs.len;
    if (k === 'Enter') return submit();
    if (k === 'Backspace') { current = current.slice(0, -1); return updateCurrentRow(); }
    const ch = normKey(k, prefs.lang);
    if (ch && current.length < L) { current += ch; updateCurrentRow(); }
  }

  function submit() {
    const L = prefs.len, W = words(prefs.lang, L);
    const row = boardEl.children[game.guesses.length];
    if (current.length < L) { shake(row); return toast(t().short); }
    if (!W.valid.has(current)) { shake(row); return toast(t().notList); }
    const r = game.guesses.length;
    game.guesses.push(current); current = '';
    const won = game.guesses[r] === game.answer;
    if (won) game.status = 'won'; else if (game.guesses.length >= ROWS) game.status = 'lost';
    saveGame();
    busy = true;
    renderBoard(r);
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const delay = reduce ? 30 : L * 250 + 300;
    setTimeout(() => {
      busy = false;
      renderKeyboard();
      if (game.status !== 'play') {
        record(won, game.guesses.length);
        if (won) {
          toast(t().wins[r], 1800);
          [...boardEl.children[r].children].forEach((tile, i) => { tile.classList.remove('flip'); tile.style.animationDelay = (i * 90) + 'ms'; tile.classList.add('win'); });
        } else toast(shown(prefs.lang, L, game.answer).toUpperCase(), 2600);
        renderEnd();
        setTimeout(openStats, reduce ? 300 : 1700);
      }
    }, delay);
  }
  function shake(row) { if (!row) return; row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); }

  kbEl.addEventListener('click', e => { const b = e.target.closest('.key'); if (b) { press(b.dataset.k); b.blur(); } });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (!$('overlay').hidden) { if (e.key === 'Escape') closeModal(); return; }
    if (e.target.closest && e.target.closest('.controls, header')) { if (e.key === 'Enter' || e.key === ' ') return; }
    if (e.key === 'Enter' || e.key === 'Backspace') { e.preventDefault(); press(e.key); }
    else if (e.key.length === 1) press(e.key);
  });

  // ---------- controls ----------
  function setPref(p) { Object.assign(prefs, p); store.set('prefs', prefs); loadGame(); renderAll(); }
  $('langSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { setPref({ lang: b.dataset.lang }); b.blur(); } });
  $('lenSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { setPref({ len: +b.dataset.len }); b.blur(); } });
  $('modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { setPref({ mode: b.dataset.mode }); b.blur(); } });
  function startFree() { game = Object.assign(newFree(), { key: gameKey() }); current = ''; saveGame(); renderAll(); }

  // ---------- modals ----------
  function openModal(html) {
    const m = $('modal');
    m.innerHTML = `<button class="icon-btn close" aria-label="${t().close}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>` + html;
    m.querySelector('.close').onclick = closeModal;
    $('overlay').hidden = false;
    m.querySelector('.close').focus();
  }
  function closeModal() { $('overlay').hidden = true; }
  $('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });

  function exampleTiles(word, cls, pos) {
    return '<div class="example">' + [...word].map((c, i) => `<div class="tile ${i === pos ? cls : ''}">${c}</div>`).join('') + '</div>';
  }
  function openHelp() {
    const x = t();
    let html = `<h2>${x.help}</h2>${x.helpBody(prefs.len)}`;
    x.ex.forEach(([cls, w, pos, txt]) => { html += exampleTiles(w, cls, pos) + `<p>${txt}</p>`; });
    html += x.modes;
    openModal(html);
  }
  function openStats() {
    const x = t(), s = getStats();
    const max = Math.max(1, ...s.dist);
    const cur = game.status === 'won' ? game.guesses.length : -1;
    let html = `<h2>${x.stats}</h2><p class="scope">${x.scope(prefs.len)} · ${prefs.mode === 'daily' ? x.daily : x.free}</p>
      <div class="stats">
        <div><div class="num">${s.played}</div><div class="lbl">${x.played}</div></div>
        <div><div class="num">${s.played ? Math.round(s.wins / s.played * 100) : 0}</div><div class="lbl">${x.winPct}</div></div>
        <div><div class="num">${s.streak}</div><div class="lbl">${x.streak}</div></div>
        <div><div class="num">${s.best}</div><div class="lbl">${x.best}</div></div>
      </div><h3>${x.dist}</h3><div class="dist">`;
    s.dist.forEach((n, i) => {
      html += `<div class="bar-row"><span>${i + 1}</span><div><div class="bar ${i + 1 === cur ? 'cur' : ''}" style="width:${Math.max(8, n / max * 100)}%">${n}</div></div></div>`;
    });
    html += '</div>';
    html += `<div class="export-row"><button class="btn ghost" id="mExport">${x.exportAll}</button></div><div id="exportSlot" aria-live="polite"></div>`;
    if (game.status !== 'play') {
      html += '<div class="modal-actions">';
      if (prefs.mode === 'daily') html += `<button class="btn" id="mShare">${x.share}</button>`;
      else html += `<button class="btn ghost" id="mShare">${x.share}</button><button class="btn" id="mNext">${x.next}</button>`;
      html += '</div><div id="shareSlot"></div>';
    }
    openModal(html);
    const ms = $('mShare'); if (ms) ms.onclick = share;
    const mn = $('mNext'); if (mn) mn.onclick = () => { closeModal(); startFree(); };
    $('mExport').onclick = openExport;
  }

  // ---------- export ----------
  const LANG_TAG = { pt: 'pt-BR', es: 'es-LA', en: 'en-US' };
  const blankStats = () => ({ played: 0, wins: 0, streak: 0, best: 0, dist: [0, 0, 0, 0, 0, 0] });
  function csvCell(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function allGames() {
    const m = {};
    store.get('log', []).forEach(e => { m[e.id] = e; });
    // older finished daily games saved before the log existed
    Object.keys(mirror).forEach(k => {
      if (!k.startsWith('daily:') || m[k]) return;
      const g = mirror[k], [, lang, len, day] = k.split(':');
      if (!g || g.status === 'play') return;
      const d = new Date(EPOCH); d.setDate(d.getDate() + (+day - 1));
      m[k] = { id: k, t: d.getTime(), date: isoDate(d), mode: 'daily', lang, len: +len, day: +day, answer: g.answer,
        result: g.status === 'won' ? 'won' : 'lost', tries: g.status === 'won' ? g.guesses.length : null, guesses: g.guesses };
    });
    return Object.values(m).sort((a, b) => a.t - b.t);
  }
  function exportText() {
    const now = new Date();
    let out = `# Trivoca data export\nExported: ${isoDate(now)} ${now.toTimeString().slice(0, 5)} (${Intl.DateTimeFormat().resolvedOptions().timeZone || 'local time'})\n`;
    out += `Game: 6 tries per word. tries = guesses used on a win (blank on a loss). Words shown without accents.\n\n`;
    out += '## Summary\nlanguage,letters,mode,played,wins,win_pct,current_streak,best_streak,won_in_1,won_in_2,won_in_3,won_in_4,won_in_5,won_in_6,losses\n';
    ['daily', 'free'].forEach(mode => ['pt', 'es', 'en'].forEach(lang => [5, 6].forEach(len => {
      const s = store.get(`stats:${mode}:${lang}:${len}`, blankStats());
      out += [LANG_TAG[lang], len, mode, s.played, s.wins, s.played ? Math.round(s.wins / s.played * 100) : 0, s.streak, s.best, ...s.dist, s.played - s.wins].join(',') + '\n';
    })));
    const games = allGames();
    out += `\n## Games (${games.length})\ndate,mode,language,letters,daily_no,answer,result,tries,guesses\n`;
    games.forEach(g => {
      out += [g.date, g.mode, LANG_TAG[g.lang], g.len, g.day, g.answer, g.result, g.tries, g.guesses.join(' ')].map(csvCell).join(',') + '\n';
    });
    return out;
  }
  function openExport() {
    const x = t(), slot = $('exportSlot'), txt = exportText();
    const show = html => { slot.innerHTML = html; };
    const fallback = () => {
      show(`<p class="scope" style="margin-top:12px">${x.copyHint}</p><textarea class="share-fallback" id="exportTxt" readonly></textarea>`);
      const ta = $('exportTxt'); ta.value = txt; ta.focus(); ta.select();
    };
    try {
      navigator.clipboard.writeText(txt).then(
        () => show(`<p class="scope" aria-live="polite" style="margin-top:10px">${x.exported}</p>`),
        fallback);
    } catch (e) { fallback(); }
  }
  $('helpBtn').onclick = openHelp;
  $('statsBtn').onclick = openStats;

  function shareText() {
    const tag = prefs.lang === 'pt' ? 'pt-BR' : prefs.lang === 'es' ? 'es-LA' : 'en-US';
    const n = game.status === 'won' ? game.guesses.length : 'X';
    const head = `Trivoca ${tag} · ${prefs.len} ` + (prefs.mode === 'daily' ? t().day(dayNumber()) : t().free) + ` · ${n}/${ROWS}`;
    const grid = game.guesses.map(g => score(g, game.answer).map(r => r === 'hit' ? '🟩' : r === 'near' ? '🟨' : '⬛').join('')).join('\n');
    return head + '\n\n' + grid;
  }
  function share() {
    const txt = shareText();
    const fallback = () => {
      if ($('overlay').hidden) openStats();
      const slot = $('shareSlot'); if (!slot) return;
      slot.innerHTML = `<p style="margin-top:12px">${t().copyHint}</p><textarea class="share-fallback" id="shareTxt" readonly></textarea>`;
      const ta = $('shareTxt'); ta.value = txt; ta.focus(); ta.select();
    };
    try {
      navigator.clipboard.writeText(txt).then(() => toast(t().copied), fallback);
    } catch (e) { fallback(); }
  }

  // ---------- boot ----------
  window.addEventListener('resize', sizeTiles);
  window.addEventListener('orientationchange', () => setTimeout(sizeTiles, 250));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', sizeTiles);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeTiles);
  if (window.ResizeObserver) new ResizeObserver(sizeTiles).observe($('boardWrap'));
  setInterval(() => { if (prefs.mode === 'daily' && game && game.key !== gameKey()) { loadGame(); renderAll(); } }, 60000);
  loadGame();
  renderAll();
})();
</script>

</body>
</html>
